kubernetes:
  vars:
    ansible_user: ubuntu
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
    k3s_version: v1.35.2+k3s1
    install_qemu_guest_agent: true

  children:
    workers:
      hosts:
        k8snode[1:3].:
    masters:
      hosts:
        k8smaster1.:
s1server:
  vars:
    ansible_user: root
    ansible_ssh_private_key_file: ~/.ssh/id_rsa
  children:
    server:
      hosts:
        pve.:
