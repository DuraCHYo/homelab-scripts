- name: Homelab k3s cluster installer/flusher
  hosts: kubernetes
  become: true
  tasks:
    - name: 'flush cluster'
      ansible.builtin.include_tasks: flush-cluster.yaml
      when: flush_all | default(false) | bool

    - name: 'install cluster'
      ansible.builtin.include_tasks: play-install-cluster.yaml
      when: not flush_all | default(false) | bool
