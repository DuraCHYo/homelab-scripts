apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - base/
  - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/stable/manifests/install.yaml

patches:
  - path: overlays/argocd-cmd-params-cm.yaml
  - path: overlays/argocd-cm.yaml
  - target:
      kind: (Deployment|StatefulSet)
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      name: argocd-dex-server
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      name: argocd-repo-server
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      name: argocd-redis-server
      kind: Deployment
    patch: |-
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
images:
  - name: quay.io/argoproj/argocd
    newTag: v3.3.4
  - name: public.ecr.aws/docker/library/redis
    newName: docker.io/redis
    newTag: 8.6.1-alpine3.23
