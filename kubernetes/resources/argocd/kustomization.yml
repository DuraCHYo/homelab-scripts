apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: argocd

resources:
  - base/
  - https://raw.githubusercontent.com/argoproj/argo-cd/refs/tags/stable/manifests/install.yaml

patches:
  - path: overlays/argocd-cmd-params-cm.yaml
  - path: overlays/argocd-cm.yaml
  - target:
      kind: (Deployment|StatefulSet)
      name: .*
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
images:
  - name: quay.io/argoproj/argocd
    newName: ghcr.io/argoproj/argo-cd/argocd
    newTag: 3.5.0-4aabf526
