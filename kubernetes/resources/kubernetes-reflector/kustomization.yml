apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kubernetes-reflector

helmCharts:
  - name: reflector
    repo: https://emberstack.github.io/helm-charts
    version: 10.0.21
    releaseName: kubernetes-reflector
    namespace: kubernetes-reflector
    valuesFile: values.yaml
    includeCRDs: true
