# Default values for the Pulse Helm chart.
# This file can be used as-is for a minimal installation or as a reference when
# overriding values (for example with `-f custom-values.yaml`).

replicaCount: 1

# Deployment strategy. Default is RollingUpdate, but Recreate is recommended
# when using ReadWriteOnce (RWO) persistent volumes to avoid Multi-Attach errors.
strategy:
  type: RollingUpdate

image:
  repository: rcourtman/pulse
  # Overrides the image tag whose default is the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  enabled: true
  fsGroup: 1000

containerSecurityContext:
  enabled: true
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000


service:
  type: ClusterIP
  port: 7655
  annotations: {}
  loadBalancerIP: ""
  externalTrafficPolicy: Cluster

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: pulse.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 8Gi
  annotations: {}

server:
  env:
    - name: TZ
      value: Europe/Moscow
  envFrom: []
  extraEnv: []
  extraEnvFrom: []
  secretEnv:
    create: false
    name: ""
    data: {}
    keys: []
  podAnnotations: {}
  podLabels: {}
  podSecurityContext: {}
  securityContext: {}
  extraVolumes: []
  extraVolumeMounts: []
  resources: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 20
    periodSeconds: 30
    timeoutSeconds: 5
    failureThreshold: 3
  readinessProbe:
    enabled: true
    path: /
    initialDelaySeconds: 10
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3

agent:
  # Optional in-cluster agent workload.
  # This deploys the unified `pulse-agent` in container-monitoring mode.
  enabled: false 

# Monitoring configuration
# Note: The ServiceMonitor targets the main HTTP service (7655). Prometheus metrics are
# served on 9091 by the Pulse server, so scraping requires an additional Service.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    scrapeTimeout: 10s
    path: /metrics
    labels: {}
    relabelings: []
    metricRelabelings: []
