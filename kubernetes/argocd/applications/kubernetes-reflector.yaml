apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubernetes-reflector
  namespace: argocd
spec:
  destination:
    namespace: kubernetes-reflector
    server: https://kubernetes.default.svc
  project: default
  source:
    path: kubernetes/resources/kubernetes-reflector
    repoURL: https://github.com/DuraCHYo/homelab-scripts
    targetRevision: master
  syncPolicy:
    automated:
      enabled: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        cert-manager.io/inject-cert: 'true'
